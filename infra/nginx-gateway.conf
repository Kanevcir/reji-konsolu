upstream reji_api {
  least_conn;
  server api:8080 max_fails=3 fail_timeout=10s;
  server worker:8080 max_fails=3 fail_timeout=10s;
  keepalive 64;
}

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 8080;
  server_name _;
  client_max_body_size 1m;

  location /health {
    proxy_pass http://reji_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Worker-Upstream $upstream_addr;
  }

  location /metrics {
    proxy_pass http://reji_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  location /auth/ {
    proxy_pass http://reji_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location /api/ {
    proxy_pass http://reji_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
  }

  # WebSocket — JWT query veya Authorization
  location /ws {
    proxy_pass http://reji_api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }
}
