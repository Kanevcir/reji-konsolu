upstream reji_api {
  least_conn;
  server api:8080 max_fails=3 fail_timeout=10s;
  server worker:8080 max_fails=3 fail_timeout=10s;
  keepalive 64;
}

upstream reji_web {
  server web:80;
}

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  listen [::]:80;
  server_name teyalabs.com www.teyalabs.com _;

  client_max_body_size 10m;

  # Expo Web Arayüzü (Frontend)
  location / {
    proxy_pass http://reji_web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Backend Health & Metrics
  location /health {
    proxy_pass http://reji_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  location /metrics {
    proxy_pass http://reji_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  # Backend Auth & REST API
  location /auth/ {
    proxy_pass http://reji_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /api/ {
    proxy_pass http://reji_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Real-IP $remote_addr;
  }

  # WebSocket Hub
  location /ws {
    proxy_pass http://reji_api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }
}
